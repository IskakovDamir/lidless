name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Unit tests
        run: swift test
      - name: Bundle
        run: |
          bash script/build.sh --no-install
          ditto -c -k --keepParent "$HOME/Library/Caches/lidless-build/Lidless.app" Lidless-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lidless-macos
          path: Lidless-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Unit tests
        run: dotnet test windows/tests/Lidless.Tests.csproj -c Release
      - name: Build
        run: dotnet build windows/src/Lidless.csproj -c Release -o out
      - name: Smoke test
        shell: pwsh
        run: |
          # The hook mode must exit 0 quickly and print nothing, even with no app running.
          # Lidless.exe is a WinExe: `& exe` neither waits for it nor sets $LASTEXITCODE, so run it as a Process.
          $psi = [System.Diagnostics.ProcessStartInfo]::new((Resolve-Path .\out\Lidless.exe).Path, 'hook release')
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $p = [System.Diagnostics.Process]::Start($psi)
          $p.StandardInput.Write('{"session_id":"ci"}')
          $p.StandardInput.Close()
          $out = $p.StandardOutput.ReadToEndAsync()
          $err = $p.StandardError.ReadToEndAsync()
          if (-not $p.WaitForExit(10000)) { $p.Kill(); throw "hook did not exit within 10 s" }
          if ($p.ExitCode -ne 0) { throw "hook exit code $($p.ExitCode)" }
          if ($out.Result) { throw "hook printed output: $($out.Result)" }
          if ($err.Result) { throw "hook printed to stderr: $($err.Result)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Lidless-windows
          path: out/Lidless.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Lidless-macos/Lidless-macos.zip
            dist/Lidless-windows/Lidless.exe
